<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Endereço</title>
    <meta name="description" content="Consulta de endereço utilizando o CEP.">
    <meta name="robots" content="index follow">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Consulta de Endereço (por CEP)</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Endereço</legend>
                <div>
                    <label for="cep">CEP</label>
                    <input id="cep" type="text" placeholder="Digite o CEP" required>
                </div>              
                <div>
                    <label for="estado">Estado</label>
                    <select id="estado" required>
                        <option value="" selected>Selecione</option>
                        <option value="df">DF</option>
                    </select>
                </div>
                <div>
                    <label for="cidade">Cidade</label>
                    <input id="cidade" type="text" placeholder="Qual é a cidade?" required>
                </div>
                <div>
                    <label for="bairro">Bairro</label>
                    <input id="bairro" type="text" placeholder="Qual é o bairro?" required>
                </div>
                <div>
                    <label for="endereco">Endereço</label>
                    <input id="endereco" type="text" placeholder="Qual é o endereço?" required>
                </div>
                <div>
                    <label for="numero">nº</label>
                    <input id="numero" type="number" placeholder="Número" required>
                </div>
            </fieldset>
            <button type="submit">Enviar</button>
        </form>
    </main>
    <footer>
        <p>por Efraim Costa</p>
    </footer>
</body>
</html>
